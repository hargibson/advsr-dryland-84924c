<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Adv. Senior Dryland Guide</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#E8EDF6; --ink:#0A1530; --muted:#44536E;
  --edge:#A3AFC6; --accent:#00205B; --accent-ink:#FFFFFF; --blue:#1B58B0;
  --go:#0A6F36; --go-ink:#FFFFFF; --bad:#B3202C; --warn:#7F4C00;
  --t-good:#DDF3E6; --t-warn:#FBEBCB; --t-info:#DEE9FB; --scrim:rgba(10,21,48,.55);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A1020; --surface:#121B30; --surface2:#1B2744; --ink:#E8EEFB; --muted:#9AABCB;
    --edge:#3E5283; --accent:#6CACE4; --accent-ink:#06142E; --blue:#7DB5EE;
    --go:#2BC16B; --go-ink:#04200F; --bad:#FF7078; --warn:#EAB24C;
    --t-good:#0F2A1D; --t-warn:#33270F; --t-info:#14264A; --scrim:rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;line-height:1.15;margin:4px 0 2px}
h2{font-size:22px;line-height:1.2;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1 1 0}
button,.btn{font:inherit;font-weight:700;min-height:52px;padding:10px 18px;border-radius:12px;border:2px solid var(--accent);
  background:var(--surface);color:var(--accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink)}
button.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
button.quiet{border-color:var(--edge);color:var(--ink);font-weight:600}
button.big{min-height:76px;font-size:22px;width:100%}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--t-info);color:var(--ink);font-size:13px;font-weight:600}
.chip.warn{background:var(--t-warn)}
.chip.good{background:var(--t-good)}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--edge)}
.top .row{flex-wrap:nowrap}
.top button{min-height:44px;padding:6px 14px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.timer{font-size:clamp(76px,26vw,128px);font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 6px;letter-spacing:-.02em}
.timer.rest{color:var(--blue)}
.timer.lead{color:var(--warn)}
.counter{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.counter .n{font-size:clamp(76px,26vw,120px);font-weight:800;min-width:2ch;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.counter button{width:64px;min-height:64px;font-size:30px;padding:0}
label.field{display:flex;align-items:center;gap:10px;margin:8px 0}
input[type=number],select{font:inherit;min-height:48px;border-radius:10px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);padding:6px 10px}
input[type=number]{width:96px;text-align:center;font-size:20px;font-weight:700}
.target{font-size:18px;font-weight:700}
.vid{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:0;padding:8px;border-radius:12px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);font-weight:500;margin:8px 0}
.vid img{width:120px;height:68px;object-fit:cover;border-radius:8px;background:var(--surface2);flex:none}
.vid .t{font-weight:700;font-size:14px;line-height:1.25}
.vid .c{font-size:13px;color:var(--muted)}
.vid .role{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
ul.cues{margin:4px 0 4px 18px;padding:0}
.coach{background:var(--t-warn);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--edge);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1}
.sheet{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet.center{align-items:center;padding:16px}
.sheet.center .panel{border-radius:16px;padding:12px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.list button{width:100%;justify-content:space-between;margin:6px 0;min-height:48px;text-align:left}
.res{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--surface2);font-size:15px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.switch input{width:24px;height:24px}
@media (prefers-reduced-motion: reduce){ .bar>i{transition:none} }
</style>
</head>

const app = document.getElementById('app');

/* ---------- small helpers ---------- */
function el(tag, a){
  const e = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else if (k === 'for') e.htmlFor = v;
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'type' || k === 'min' || k === 'max' || k === 'inputMode') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++){
    const c = arguments[i];
    (Array.isArray(c) ? c : [c]).forEach(x => { if (x == null || x === false) return; e.append(x.nodeType ? x : document.createTextNode(String(x))); });
  }
  return e;
}
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const secLabel = s => s >= 60 && s % 60 === 0 ? (s/60) + ':00' : ':' + String(s).padStart(2,'0');

/* ---------- settings and history (this phone only) ---------- */
let cfg = Object.assign({ rest: D.rest || 45, sound: true, vibrate: true, awake: true, coach: false }, LS.get('dl.' + D.id + '.cfg', {}));
let hist = LS.get('dl.' + D.id + '.hist', {});
const saveCfg = () => LS.set('dl.' + D.id + '.cfg', cfg);

/* ---------- audio, vibration, wake lock ---------- */
let AC = null, wake = null;
function initAudio(){
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){}
}
function beep(freq, ms){
  if (cfg.sound && AC){
    try {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = freq; o.type = 'sine'; g.gain.value = 0.25;
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + ms/1000);
    } catch(e){}
  }
}
function buzz(p){ if (cfg.vibrate && navigator.vibrate) { try { navigator.vibrate(p); } catch(e){} } }
async function wakeOn(){
  try { if (cfg.awake && navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch(e){}
}
function wakeOff(){ try { if (wake){ wake.release(); wake = null; } } catch(e){} }
document.addEventListener('visibilitychange', () => { if (!document.hidden){ if (S.view === 'run') wakeOn(); tick(); } });

/* ---------- state ---------- */
const S = { view: 'home', day: null, steps: [], i: 0, phase: 'idle', R: {}, prev: {}, fresh: {} };
let T = null;            // active timer: {total, endAt, lastSl, remain}
let ticker = null;

function dayById(id){ return D.days.find(d => d.id === id); }

function buildSteps(day, short){
  const steps = [];
  day.blocks.forEach(b => b.items.forEach(it => {
    if (short && it.trim) return;
    const sets = it.sets || 1;
    if (it.kind === 'count'){
      steps.push({ type: 'count', it, b, setNo: 1, sets: 1 });
    } else if (it.kind === 'timed'){
      const sides = it.sides || [null];
      for (let s = 1; s <= sets; s++){
        sides.forEach(side => steps.push({ type: 'timed', it, b, secs: it.secs, setNo: s, sets, side }));
        if (s < sets && cfg.rest > 0) steps.push({ type: 'rest', it, b, secs: cfg.rest });
      }
    } else {
      const sides = it.per_side ? ['Right ' + it.per_side, 'Left ' + it.per_side] : [null];
      for (let s = 1; s <= sets; s++){
        sides.forEach(side => steps.push({ type: 'reps', it, b, setNo: s, sets, side }));
        if (s < sets && cfg.rest > 0) steps.push({ type: 'rest', it, b, secs: cfg.rest });
      }
    }
  }));
  steps.forEach((s, i) => { s.i = i; });
  return steps;
}
function estMinutes(day, short){
  let sec = 0;
  buildSteps(day, short).forEach(s => {
    if (s.type === 'timed') sec += s.secs + (s.b.chain ? 3 : 8);
    else if (s.type === 'rest') sec += s.secs;
    else if (s.type === 'reps') sec += 45;
    else if (s.type === 'count') sec += 120;
  });
  return Math.round(sec / 300) * 5;
}
const keyOf = (day, it) => day.id + '|' + it.id;

/* ---------- timer engine ---------- */
function startTimer(secs){ T = { total: secs * 1000, endAt: Date.now() + secs * 1000, lastSl: null }; }
function clearTimer(){ T = null; }
function pauseTimer(){ if (T && S.phase === 'running'){ T.remain = Math.max(0, T.endAt - Date.now()); S.phase = 'paused'; render(); } }
function resumeTimer(){ if (T && S.phase === 'paused'){ T.endAt = Date.now() + T.remain; S.phase = 'running'; initAudio(); render(); } }
function tick(){
  if (S.view !== 'run' || !T || (S.phase !== 'running' && S.phase !== 'lead')) return;
  const remain = Math.max(0, T.endAt - Date.now());
  const sl = Math.ceil(remain / 1000);
  if (sl !== T.lastSl){
    T.lastSl = sl;
    if (sl >= 1 && sl <= 3) beep(660, 120);
  }
  const t = document.getElementById('timerText'), b = document.getElementById('timerBar');
  if (t) t.textContent = S.phase === 'lead' ? String(sl) : mmss(remain / 1000);
  if (b) b.style.width = (100 * (1 - remain / T.total)) + '%';
  if (remain <= 0) onTimerEnd();
}
function onTimerEnd(){
  const st = S.steps[S.i];
  if (S.phase === 'lead'){
    S.phase = 'running'; startTimer(st.secs); beep(880, 250); buzz(120); render(); return;
  }
  if (st.type === 'rest'){
    beep(880, 300); buzz([150, 80, 150]); goNext(false); return;
  }
  // a timed set finished
  S.R[S.i] = { done: true };
  beep(880, 220); setTimeout(() => beep(880, 380), 300); buzz([300, 100, 300]);
  const nxt = S.steps[S.i + 1];
  if (!nxt){ finish(); return; }
  goNext(nxt.type === 'timed' && nxt.b === st.b && st.b.chain);
}
function enter(i, auto){
  S.i = i; clearTimer();
  const st = S.steps[i];
  if (st.type === 'rest'){ startTimer(st.secs); S.phase = 'running'; }
  else if (st.type === 'timed' && auto){ T = { total: 3000, endAt: Date.now() + 3000, lastSl: null }; S.phase = 'lead'; }
  else S.phase = 'idle';
  render(); window.scrollTo(0, 0);
}
function goNext(auto){
  if (S.i >= S.steps.length - 1){ finish(); return; }
  enter(S.i + 1, auto);
}
function goPrev(){
  let j = S.i - 1;
  while (j > 0 && S.steps[j].type === 'rest') j--;
  if (j >= 0) enter(j, false);
}
function startRun(dayId, itemId, short){
  initAudio();
  S.day = dayById(dayId); S.short = !!short; S.steps = buildSteps(S.day, S.short); S.R = {}; S.fresh = {}; S.prev = JSON.parse(JSON.stringify(hist));
  S.view = 'run'; wakeOn();
  let i = 0;
  if (itemId){ const j = S.steps.findIndex(s => s.it.id === itemId); if (j >= 0) i = j; }
  enter(i, false);
}
function finish(){
  clearTimer(); S.phase = 'idle'; S.view = 'summary'; wakeOff(); render(); window.scrollTo(0, 0);
}
function logSet(){
  const st = S.steps[S.i]; const r = S.R[S.i] || { reps: 0 };
  const fresh = S.fresh;
  const k = keyOf(S.day, st.it);
  if (!fresh[k]) fresh[k] = { when: new Date().toISOString().slice(0, 10), sets: [] };
  fresh[k].sets.push({ side: st.side || '', reps: r.reps || 0, weight: r.weight || '' });
  hist = Object.assign({}, hist, { [k]: fresh[k] }); LS.set('dl.' + D.id + '.hist', hist);
  r.done = true; S.R[S.i] = r;
}

function targetText(st){

  if (it.kind === 'reps') return 'Target: ' + (it.lo === it.hi ? it.lo : it.lo + '–' + it.hi) + ' reps' + (it.per_side ? ' each ' + it.per_side : '');

function lastTime(st){
  const h = S.prev[keyOf(S.day, st.it)];
  if (!h || !h.sets || !h.sets.length) return null;
  const s = h.sets.map(x => (x.side ? x.side.slice(0, 1) + ': ' : '') + x.reps + (x.weight ? ' @ ' + x.weight : '')).join(', ');
  return 'Last time (' + h.when + '): ' + s;

  const wrap = el('div');

    el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(real.length), 'aria-valuenow': String(pos) }, el('i', { style: 'width:' + (100 * pos / real.length) + '%' }))));

  if (st.type === 'rest'){
    let nextIdx = S.i + 1; const nx = S.steps[nextIdx];
    wrap.append(el('div', { class: 'card' },
      el('div', { class: 'eyebrow', text: 'Rest' }),
      el('div', { id: 'timerText', class: 'timer rest', 'aria-live': 'off', text: mmss(T ? Math.max(0, T.endAt - Date.now()) / 1000 : st.secs) }),
      el('div', { class: 'bar' }, el('i', { id: 'timerBar' })),
      nx ? el('p', { class: 'small', text: 'Up next: ' + nx.it.name + ' · set ' + nx.setNo + ' of ' + nx.sets + (nx.side ? ' · ' + nx.side : '') }) : null,
      el('div', { class: 'row' },
        el('button', { class: 'quiet grow', onclick: () => { if (T){ T.endAt += 15000; T.total += 15000; } }, text: '+15 sec' }),
        el('button', { class: 'primary grow', onclick: () => goNext(false), text: 'Skip rest' }))));
  } else {
    const card = el('div', { class: 'card' });
    card.append(el('h2', { text: it.name }),
      el('p', { class: 'muted', text: (st.sets > 1 ? 'Set ' + st.setNo + ' of ' + st.sets : '') + (st.side ? (st.sets > 1 ? ' · ' : '') + st.side : '') + (it.note ? (st.sets > 1 || st.side ? ' · ' : '') + it.note : '') }),
      el('p', { class: 'target', text: targetText(st) }));
    if (st.type === 'timed') card.append(timedControls(st));
    else card.append(counterControls(st));
    const lt = (st.type === 'reps') ? lastTime(st) : null;
    if (lt) card.append(el('p', { class: 'muted small', text: lt }));
    wrap.append(card);
    wrap.append(...itemExtras(it, false));
  }
  const last = S.i >= S.steps.length - 1;
  wrap.append(el('div', { class: 'nav' }, el('div', { class: 'in' },
    el('button', { class: 'quiet', onclick: goPrev, disabled: S.i === 0, text: '‹ Back' }),
    el('button', { class: 'primary', onclick: () => { if (st.type === 'timed') clearTimer(); goNext(false); }, text: last ? 'Finish' : (st.type === 'reps' || st.type === 'count' ? 'Skip ›' : 'Next ›') }))));
  return wrap;
}
function timedControls(st){
  const box = el('div');
  const running = S.phase === 'running', lead = S.phase === 'lead', paused = S.phase === 'paused';
  const remain = T ? Math.max(0, (paused ? T.remain : T.endAt - Date.now())) / 1000 : st.secs;
  box.append(el('div', { id: 'timerText', class: 'timer' + (lead ? ' lead' : ''), 'aria-live': 'off', text: lead ? String(Math.ceil(remain)) : mmss(remain) }),
    el('div', { class: 'bar' }, el('i', { id: 'timerBar', style: 'width:' + (T && !lead ? 100 * (1 - remain * 1000 / T.total) : 0) + '%' })));
  if (lead) box.append(el('p', { class: 'small', style: 'text-align:center', text: 'Get ready…' }));
  const row = el('div', { class: 'row' });
  if (S.phase === 'idle') row.append(el('button', { class: 'go big', onclick: () => { initAudio(); startTimer(st.secs); S.phase = 'running'; beep(880, 200); buzz(80); render(); }, text: 'Start ' + secLabel(st.secs) }));
  else if (running) row.append(el('button', { class: 'big', onclick: pauseTimer, text: 'Pause' }));
  else if (paused) row.append(el('button', { class: 'go big', onclick: resumeTimer, text: 'Resume' }));
  if (S.phase !== 'idle') row.append(el('button', { class: 'quiet', style: 'width:100%', onclick: () => { clearTimer(); S.phase = 'idle'; render(); }, text: 'Reset' }));
  box.append(row);
  return box;
}
function counterControls(st){
  const it = st.it;
  const r = S.R[S.i] || (S.R[S.i] = { reps: 0, weight: '' });
  const setN = v => { r.reps = Math.max(0, v); const n = document.getElementById('cnt'), inp = document.getElementById('cntIn'); if (n) n.textContent = r.reps; if (inp) inp.value = r.reps; };
  const box = el('div');
  box.append(el('div', { class: 'counter' },
    el('button', { class: 'quiet', onclick: () => setN(r.reps - 1), 'aria-label': 'Minus one', text: '−' }),
    el('div', { id: 'cnt', class: 'n', 'aria-live': 'polite', text: r.reps }),
    el('button', { class: 'primary', onclick: () => { initAudio(); setN(r.reps + 1); buzz(20); }, 'aria-label': 'Plus one', text: '+' })));
  box.append(el('button', { class: 'primary big', onclick: () => { initAudio(); setN(r.reps + 1); buzz(20); }, text: it.kind === 'count' ? '+1 lap' : '+1 rep' }));
  box.append(el('label', { class: 'field' }, el('span', { text: 'Or type it' }),
    el('input', { id: 'cntIn', type: 'number', inputMode: 'numeric', min: '0', value: r.reps, oninput: e => setN(parseInt(e.target.value, 10) || 0) })));
  if (it.weight){
    box.append(el('label', { class: 'field' }, el('span', { text: 'Weight (lb)' }),
      el('input', { type: 'text', inputMode: 'decimal', value: r.weight || '', placeholder: 'optional', style: 'width:110px;min-height:48px;border-radius:10px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);padding:6px 10px;font:inherit;font-size:18px;text-align:center',
        oninput: e => { r.weight = e.target.value.trim(); } })));
  }
  box.append(el('button', { class: 'go big', onclick: () => { if (st.type === 'count'){ r.done = true; goNext(false); } else { logSet(); goNext(false); } }, text: st.type === 'count' ? 'Done' : 'Set done ✓' }));
  return box;
}

function confirmEnd(){
  const sheet = el('div', { class: 'sheet center', role: 'dialog', 'aria-label': 'End workout' },
    el('div', { class: 'panel' }, el('h2', { text: 'End this workout?' }), el('p', { class: 'muted', text: 'Sets you already logged are kept.' }),
      el('div', { class: 'row' },
        el('button', { class: 'primary grow', onclick: () => { clearTimer(); wakeOff(); S.view = 'summary'; S.phase = 'idle'; render(); }, text: 'End and see summary' }),
        el('button', { class: 'quiet grow', onclick: () => sheet.remove(), text: 'Keep going' }))));
  document.body.append(sheet);
}
function openList(){
  const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-label': 'Jump to an exercise', onclick: e => { if (e.target === sheet) sheet.remove(); } });
  const panel = el('div', { class: 'panel' }, el('div', { class: 'row between' }, el('h2', { text: 'Jump to' }), el('button', { class: 'quiet', onclick: () => sheet.remove(), text: 'Close' })));
  const list = el('div', { class: 'list' });
  let lastBlock = null;
  S.day.blocks.forEach(b => {
    list.append(el('h3', { text: b.title }));
    b.items.forEach(it => {
      const idx = S.steps.findIndex(s => s.it === it);
      if (idx < 0) return;
      const done = S.steps.filter(s => s.it === it && s.type !== 'rest').every(s => S.R[s.i] && S.R[s.i].done);
      list.append(el('button', { class: S.steps[S.i].it === it ? 'primary' : '', onclick: () => { sheet.remove(); enter(idx, false); } },
        el('span', { text: it.name }), el('span', { text: done ? '✓' : '' })));
    });
  });
  panel.append(list); sheet.append(panel); document.body.append(sheet);
}

function summaryView(){
  const wrap = el('div');
  const day = S.day;
  wrap.append(el('h1', { text: 'Summary' }), el('p', { class: 'muted', text: day ? day.title : '' }));
  const lines = [];
  const card = el('div', { class: 'card' });
  if (day){
    const seen = new Set();
    S.steps.forEach(s => {
      if (s.type === 'rest' || seen.has(s.it)) return; seen.add(s.it);
      const mine = S.steps.filter(x => x.it === s.it && x.type !== 'rest');
      const parts = mine.map(x => {
        const r = S.R[x.i];
        if (!r || !r.done) return null;
        if (x.type === 'reps') return (x.side ? x.side.slice(0, 1) + ': ' : '') + (r.reps || 0) + (r.weight ? ' @ ' + r.weight : '');
        if (x.type === 'count') return (r.reps || 0) + ' ' + x.it.unit;
        return '✓';
      });
      const done = parts.filter(Boolean);
      let txt = done.length ? (mine[0].type === 'timed' ? done.length + ' of ' + mine.length + ' timed sets' : done.join(', ')) : 'not done';
      lines.push(s.it.name + ': ' + txt);
      card.append(el('div', { class: 'res' }, el('span', { text: s.it.name }), el('span', { class: 'muted', text: txt })));
    });
  }
  wrap.append(card);
  wrap.append(el('div', { class: 'row' },
    el('button', { class: 'quiet grow', onclick: () => copyText((day ? day.title : 'Dryland') + '\n' + lines.join('\n'), 'Copied'), text: 'Copy summary' }),
    el('button', { class: 'primary grow', onclick: () => { S.view = 'home'; render(); }, text: 'Home' })));
  wrap.append(el('p', { id: 'toast', class: 'muted small', role: 'status' }));
  return wrap;
}
function copyText(t, msg){
  const done = () => { const x = document.getElementById('toast'); if (x) x.textContent = msg; };
  try { navigator.clipboard.writeText(t).then(done, fallback); } catch(e){ fallback(); }
  function fallback(){ const ta = el('textarea', { value: t }); document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} ta.remove(); }
}

/* ---------- boot ---------- */
ticker = setInterval(tick, 100);
render();
window.__dl = { S, startRun, D };   // handy for testing
})();
</script>
